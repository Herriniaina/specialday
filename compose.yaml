---
services:
  php:
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}, php:80
      DEFAULT_URI: https://${SERVER_NAME:-localhost}:${HTTPS_PORT:-443}
      # Run "composer require symfony/orm-pack" to install and configure Doctrine ORM
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=${MYSQL_VERSION:-8.0.32}&charset=${MYSQL_CHARSET:-utf8mb4}
      # Messenger async transport (Redis) + Mailer (Mailpit in dev)
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailer:1025}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - name: http
        target: 80
        published: ${HTTP_PORT:-80}
        protocol: tcp
      - name: https
        target: 443
        published: ${HTTPS_PORT:-443}
        protocol: tcp
      - name: http3
        target: 443
        published: ${HTTP3_PORT:-443}
        protocol: udp

###> doctrine/doctrine-bundle ###
  database:
    image: mysql:${MYSQL_VERSION:-8.0.32}
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_RANDOM_ROOT_PASSWORD: "true"
      # You should definitely change the password in production
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-!ChangeMe!}
      MYSQL_USER: ${MYSQL_USER:-app}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 5s
      retries: 5
      start_period: 60s
    volumes:
      - database_data:/var/lib/mysql:rw
      # You may use a bind-mounted host directory instead, so that it is harder to accidentally remove the volume and lose all your data!
      # - ./docker/db/data:/var/lib/mysql:rw
###< doctrine/doctrine-bundle ###

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  # Messenger worker: consumes the "async" transport (Redis). The "failed" transport (Doctrine)
  # is NOT consumed here — it's a dead-letter queue, inspected/replayed by hand
  # (bin/console messenger:failed:show | messenger:failed:retry). Runs in both dev and prod;
  # image/build are supplied by compose.override.yaml (dev) / compose.prod.yaml (prod), the same
  # split used for the "php" service itself.
  worker:
    restart: unless-stopped
    depends_on:
      php:
        condition: service_healthy
      redis:
        condition: service_healthy
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pidof php || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-app}:${MYSQL_PASSWORD:-!ChangeMe!}@database:3306/${MYSQL_DATABASE:-app}?serverVersion=${MYSQL_VERSION:-8.0.32}&charset=${MYSQL_CHARSET:-utf8mb4}
      MESSENGER_TRANSPORT_DSN: ${MESSENGER_TRANSPORT_DSN:-redis://redis:6379/messages}
      MAILER_DSN: ${MAILER_DSN:-smtp://mailer:1025}
    # ffmpeg-based video transcoding (see FfmpegVideoTranscoder) can take a while for large
    # files; --time-limit lets the worker cycle cleanly between jobs instead of running forever.
    command: php bin/console messenger:consume async --time-limit=3600 -vv

  # Imagor: serves/transforms images on the fly, reading originals straight from S3. Runs in
  # prod too (unlike MinIO, which only simulates S3 for local dev), reverse-proxied by Caddy at
  # /imagor (see frankenphp/Caddyfile).
  imagor:
    image: shumc/imagor:latest
    restart: unless-stopped
    environment:
      PORT: "8000"
      S3_LOADER_BUCKET: ${AWS_S3_BUCKET:-specialday}
      S3_LOADER_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_S3_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_S3_SECRET_ACCESS_KEY:-minioadmin}
      AWS_REGION: ${AWS_S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: ${IMAGOR_S3_FORCE_PATH_STYLE:-1}
      IMAGOR_SECRET: ${IMAGOR_SECRET}
      # Result storage: caches already-transformed images so repeat requests for the same crop
      # aren't reprocessed — same bucket as originals, separate prefix.
      S3_RESULT_STORAGE_BUCKET: ${AWS_S3_BUCKET:-specialday}
      S3_RESULT_STORAGE_BASE_DIR: imagor-cache
      S3_RESULT_STORAGE_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      S3_RESULT_STORAGE_ACL: private
      IMAGOR_CACHE_HEADER_TTL: 168h
      IMAGOR_CACHE_HEADER_SWR: 24h

volumes:
  caddy_data:
  caddy_config:
  redis_data:

###> doctrine/doctrine-bundle ###
  database_data:
###< doctrine/doctrine-bundle ###
