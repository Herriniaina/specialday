---
# Production environment override
services:
  php:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment:
      # Decrypts the Symfony secrets vault (config/secrets/prod/); APP_SECRET and the other app
      # secrets live there. Base64 of config/secrets/prod/prod.decrypt.private.php, which is never committed.
      SYMFONY_DECRYPTION_SECRET: ${SYMFONY_DECRYPTION_SECRET:?SYMFONY_DECRYPTION_SECRET is required in prod}

  # Same image as "php" (built from the same frankenphp_prod target) — only the command differs.
  worker:
    image: ${IMAGES_PREFIX:-}app-php-prod
    build:
      context: .
      target: frankenphp_prod
    environment:
      SYMFONY_DECRYPTION_SECRET: ${SYMFONY_DECRYPTION_SECRET:?SYMFONY_DECRYPTION_SECRET is required in prod}
