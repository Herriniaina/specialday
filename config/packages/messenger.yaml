framework:
    messenger:
        failure_transport: failed

        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                retry_strategy:
                    service: App\Infrastructure\Shared\Messenger\DeadlineRetryStrategy
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            App\Infrastructure\User\Message\SendUserEmailVerification: async
            App\Infrastructure\Media\Message\TranscodeVideo: async

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
