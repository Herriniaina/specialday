security:
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        keycloak_user_provider:
            id: App\Infrastructure\Security\Keycloak\KeycloakUserProvider
        keycloak_api_user_provider:
            id: App\Infrastructure\Security\Keycloak\ApiUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            pattern: ^/admin
            # Back-office login delegated to Keycloak (OIDC Authorization Code + PKCE); roles are the
            # Keycloak realm roles. KeycloakLogoutListener also ends the Keycloak session on logout.
            provider: keycloak_user_provider
            custom_authenticators:
                - App\Infrastructure\Security\Keycloak\KeycloakAuthenticator
            entry_point: App\Infrastructure\Security\Keycloak\KeycloakAuthenticator
            logout:
                path: app_logout

        api:
            pattern: ^/api
            stateless: true
            # Resource server: clients get their access token from Keycloak (Authorization Code + PKCE
            # on the specialday-front client) and send it as a Bearer token. Its signature is checked
            # against the realm keys (fetched through discovery, cached), as well as its issuer,
            # audience (added by the clients' audience mapper) and expiry. The user is then
            # loaded from the "sub" claim, roles coming from the token (see ApiUserProvider).
            provider: keycloak_api_user_provider
            access_token:
                token_handler:
                    oidc:
                        claim: sub
                        audience: '%env(KEYCLOAK_API_CLIENT_ID)%'
                        issuers: ['%env(KEYCLOAK_URL)%/realms/%env(KEYCLOAK_REALM)%']
                        algorithms: ['RS256']
                        discovery:
                            base_uri: '%env(KEYCLOAK_INTERNAL_URL)%/realms/%env(KEYCLOAK_REALM)%/'
                            cache:
                                id: cache.app
                failure_handler: App\Infrastructure\Security\Keycloak\ApiAuthenticationFailureHandler
            entry_point: App\Infrastructure\Security\Keycloak\ApiAuthenticationFailureHandler

        main:
            lazy: true
            provider: keycloak_user_provider

    role_hierarchy:
        ROLE_COMPANY_USER:  ROLE_USER
        ROLE_COMPANY_ADMIN: ROLE_COMPANY_USER
        ROLE_ADMIN:         ROLE_COMPANY_ADMIN

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }
