security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        app_user_provider:
            entity:
                class: App\Infrastructure\User\Entity\User
                property: email
        keycloak_user_provider:
            id: App\Infrastructure\Security\Keycloak\KeycloakUserProvider

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        login:
            pattern: ^/api/public/login
            stateless: true
            provider: app_user_provider
            user_checker: App\Infrastructure\User\Security\ActiveUserChecker
            json_login:
                check_path: /api/public/login
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
                username_path: email
                password_path: password

        admin:
            pattern: ^/admin
            # Back-office login delegated to Keycloak (OIDC Authorization Code + PKCE); roles are the
            # Keycloak realm roles. KeycloakLogoutListener also ends the Keycloak session on logout.
            provider: keycloak_user_provider
            custom_authenticators:
                - App\Infrastructure\Security\Keycloak\KeycloakAuthenticator
            entry_point: App\Infrastructure\Security\Keycloak\KeycloakAuthenticator
            logout:
                path: app_logout

        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    role_hierarchy:
        ROLE_COMPANY_USER:  ROLE_USER
        ROLE_COMPANY_ADMIN: ROLE_COMPANY_USER
        ROLE_ADMIN:         ROLE_COMPANY_ADMIN

    access_control:
        - { path: ^/admin/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        - { path: ^/api,       roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
