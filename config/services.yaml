# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Infrastructure\Shared\Http\EventListeners\AcceptLanguageLocaleListener:
        arguments:
            $defaultLocale: '%kernel.default_locale%'
            $router: '@router'
        tags:
            - { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 16 }

    App\Infrastructure\Shared\Http\EventListeners\JwtAuthenticationFailureListener:
        tags:
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_not_found, method: onJwtNotFound }
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_invalid, method: onJwtInvalid }
            - { name: kernel.event_listener, event: lexik_jwt_authentication.on_jwt_expired, method: onJwtExpired }

    App\Application\User\PasswordHasherInterface:
        alias: App\Infrastructure\User\Security\SymfonyPasswordHasher

    App\Domain\Company\CompanyRepositoryInterface:
        alias: App\Infrastructure\Company\Repository\CompanyRepository

    App\Application\User\UserNotifierInterface:
        alias: App\Infrastructure\User\Notifier\MessengerUserNotifier

    App\Application\Shared\IdGeneratorInterface:
        alias: App\Infrastructure\Shared\Identity\UuidV7IdGenerator

    App\Application\Shared\SlugGeneratorInterface:
        alias: App\Infrastructure\Shared\Slug\SymfonySlugGenerator

    App\Application\Shared\TransactionInterface:
        alias: App\Infrastructure\Shared\Doctrine\DoctrineTransaction

    App\Infrastructure\User\MessageHandler\SendUserEmailVerificationHandler:
        arguments:
            $appBaseUrl: '%env(DEFAULT_URI)%'
            $mailerFrom: '%env(MAILER_FROM)%'

    App\Infrastructure\Shared\Messenger\DeadlineRetryStrategy:
        arguments:
            $retryWindowSeconds: 3600

    AsyncAws\S3\S3Client:
        arguments:
            -
                region: '%env(AWS_S3_REGION)%'
                accessKeyId: '%env(AWS_S3_ACCESS_KEY_ID)%'
                accessKeySecret: '%env(AWS_S3_SECRET_ACCESS_KEY)%'
                endpoint: '%env(default::AWS_S3_ENDPOINT)%'
                pathStyleEndpoint: '%env(bool:AWS_S3_PATH_STYLE_ENDPOINT)%'

    # Dedicated S3 client for presigned video upload URLs handed to the browser. In dev
    # AWS_S3_ENDPOINT is the Docker-internal "http://minio:9000" (unusable from a real browser)
    # while AWS_S3_PUBLIC_ENDPOINT is the host-reachable equivalent. In prod both are the same
    # (empty = default AWS endpoint).
    media.presign_s3_client:
        class: AsyncAws\S3\S3Client
        arguments:
            -
                region: '%env(AWS_S3_REGION)%'
                accessKeyId: '%env(AWS_S3_ACCESS_KEY_ID)%'
                accessKeySecret: '%env(AWS_S3_SECRET_ACCESS_KEY)%'
                endpoint: '%env(default::AWS_S3_PUBLIC_ENDPOINT)%'
                pathStyleEndpoint: '%env(bool:AWS_S3_PATH_STYLE_ENDPOINT)%'

    App\Domain\Media\MediaFileRepositoryInterface:
        alias: App\Infrastructure\Media\Repository\MediaFileRepository

    App\Domain\Subscription\SubscriptionRepositoryInterface:
        alias: App\Infrastructure\Subscription\Repository\SubscriptionRepository

    App\Application\Media\FileStorageInterface:
        alias: App\Infrastructure\Media\Storage\FlysystemFileStorage

    App\Application\Media\VideoUploadUrlGeneratorInterface:
        alias: App\Infrastructure\Media\Storage\AsyncAwsVideoUploadUrlGenerator

    App\Application\Media\MediaObjectMetadataReaderInterface:
        alias: App\Infrastructure\Media\Storage\AsyncAwsMediaObjectMetadataReader

    App\Application\Media\MediaSourceDownloaderInterface:
        alias: App\Infrastructure\Media\Storage\AsyncAwsMediaSourceDownloader

    App\Application\Media\PublicVideoStorageInterface:
        alias: App\Infrastructure\Media\Storage\AsyncAwsPublicVideoStorage

    App\Application\Media\PublicVideoUrlBuilderInterface:
        alias: App\Infrastructure\Media\Storage\PublicVideoUrlBuilder

    App\Application\Media\ImageUrlSignerInterface:
        alias: App\Infrastructure\Media\Imagor\ImagorUrlSigner

    App\Application\Media\VideoTranscoderInterface:
        alias: App\Infrastructure\Media\Video\FfmpegVideoTranscoder

    App\Application\Media\VideoTranscodeSchedulerInterface:
        alias: App\Infrastructure\Media\Messenger\MessengerVideoTranscodeScheduler