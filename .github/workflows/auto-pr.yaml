---
name: Auto PR

on:
  push:
    branches:
      - 'fix/sd-*'
      - 'fix/SD-*'
      - 'hotfix/sd-*'
      - 'hotfix/SD-*'
      - 'feat/sd-*'
      - 'feat/SD-*'

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    name: Open PR for pushed branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          # `gh pr create --fill` derives the title and body from the commits
          # between base and head, so it needs origin/main and full history.
          # The default depth of 1 only creates the pushed branch's tracking ref.
          fetch-depth: 0
      - name: Create PR if none exists yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          OPEN_PR_COUNT=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')

          if [ "$OPEN_PR_COUNT" -gt 0 ]; then
            echo "An open PR already exists for $BRANCH, skipping."
            exit 0
          fi

          if [ "$(git rev-list --count origin/main..HEAD)" -eq 0 ]; then
            echo "No commits ahead of main on $BRANCH, skipping."
            exit 0
          fi

          gh pr create --base main --head "$BRANCH" --fill
