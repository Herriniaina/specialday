---
name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      - name: Start services
        run: docker compose up --wait --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost
      # Uncomment when the homepage is configured, or change the path to check
      # - name: Check HTTPS reachability
      #   run: curl -v --insecure --fail-with-body https://localhost
      # Uncomment if Doctrine ORM is installed
      # - name: Create test database
      #   run: docker compose exec -T php bin/console -e test doctrine:database:create
      # Uncomment if Doctrine Migrations is installed
      # - name: Run migrations
      #   run: docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction
      - name: Run PHPUnit with coverage
        run: docker compose exec -T -e XDEBUG_MODE=coverage php bin/phpunit --coverage-clover=coverage.xml
      # Uncomment if Doctrine ORM is installed
      # - name: Doctrine Schema Validator
      #   run: docker compose exec -T php bin/console -e test doctrine:schema:validate
      - name: Extract coverage percentage
        id: coverage
        run: |
          PERCENTAGE=$(docker compose exec -T php php bin/coverage-percentage.php coverage.xml)
          echo "percentage=$PERCENTAGE" >> "$GITHUB_OUTPUT"
          echo "Coverage: ${PERCENTAGE}%"
      - name: Fetch coverage baseline
        id: baseline
        run: |
          BASELINE=$(curl -fsSL "https://gist.githubusercontent.com/${{ vars.COVERAGE_GIST_OWNER }}/${{ vars.COVERAGE_GIST_ID }}/raw/coverage.json" | jq -r '.message' | tr -d '%')
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "Baseline: ${BASELINE}%"
      - name: Fail if coverage decreased
        run: |
          awk -v new="${{ steps.coverage.outputs.percentage }}" -v base="${{ steps.baseline.outputs.baseline }}" \
            'BEGIN {
              if (new + 0 < base + 0) {
                printf "Coverage dropped: %.2f%% < %.2f%%\n", new, base
                exit 1
              }
              printf "Coverage OK: %.2f%% >= %.2f%%\n", new, base
            }'
      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percentage }}%
          valColorRange: ${{ steps.coverage.outputs.percentage }}
          maxColorRange: 100
          minColorRange: 0
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --no-scripts
      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

  dependabot-automerge:
    name: Dependabot auto-merge (patch)
    needs: [tests, lint]
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Merge patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
